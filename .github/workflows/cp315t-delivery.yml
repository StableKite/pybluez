name: CPython 3.15t ordinary dependency delivery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary-pip-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.15t
      - name: Ordinary pip from default branch
        working-directory: ${{ runner.temp }}
        run: python -m pip install "PyBluez @ git+https://github.com/StableKite/pybluez.git"
      - name: Static tools
        run: python -m pip install pyright ruff
      - name: Strict Pyright of actual installed sources and delivery backend
        run: python -I -B .github/scripts/check_installed_typing.py .
      - name: Lint changed Python code
        run: python -m ruff check --isolated --select E4,E7,E9,F,I,B _binary_wheel_backend.py bluetooth/msbt.py bluetooth/btcommon.py bluetooth/_msbt.pyi .github/scripts/check_installed_typing.py tests/test_msbt_free_threading.py tests/test_sdp_codec.py
      - name: Actual native APIs and concurrency with natural GIL off
        run: python -I -B -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m pip check
